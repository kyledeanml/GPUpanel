<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Unassuming Matte Yoga Pad Surface Gradient (shared with PythonPanel family) -->
    <linearGradient id="yogaMatTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22436d" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#152943" stop-opacity="0.54"/>
    </linearGradient>

    <!-- Yoga Pad Rolled End Gradient -->
    <linearGradient id="yogaRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d578b" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#13253d" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Darker Traditional PythonPanel Blue Gradient (GPU Shroud) -->
    <linearGradient id="gpuDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28598a" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#183654" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#0d1e33" stop-opacity="0.72"/>
    </linearGradient>

    <!-- Deeper Indigo-Blue Inset Gradient -->
    <linearGradient id="gpuDeepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3c5e" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#0b1726" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Neon Cyan Resource Graph Fill Gradient -->
    <linearGradient id="graphCyanFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Neon Emerald VRAM Graph Fill Gradient -->
    <linearGradient id="graphEmeraldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Crisp Cyan/Sky Edge Accent -->
    <linearGradient id="neonCyanEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== 1. PERSPECTIVE YOGA PAD (PYTHONPANEL FAMILY BASE) ==================== -->
  <g transform="translate(26, 66) scale(1.28)">
    <!-- Subtle floor shadow beneath the yoga pad -->
    <path d="M 48 258 L 288 258 L 328 214 L 92 214 Z"
          fill="#060c17" fill-opacity="0.48"/>

    <!-- Yoga Pad Thickness / Bottom Edge -->
    <path d="M 44 248 L 282 248 L 322 204 L 322 211 L 282 255 L 44 255 Z"
          fill="#1b3556" fill-opacity="0.68"
          stroke="#387eb8" stroke-width="1.2" stroke-opacity="0.58" stroke-linejoin="round"/>

    <!-- Yoga Pad Main Flat Surface -->
    <path d="M 44 248 L 282 248 L 322 204 L 88 204 Z"
          fill="url(#yogaMatTop)"
          stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.62" stroke-linejoin="round"/>

    <!-- Subtle Non-Slip Texture Lines & Center Alignment Line on the Yoga Pad -->
    <line x1="70" y1="226" x2="298" y2="226"
          stroke="#5ba4e5" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="6,5"/>
    <line x1="176" y1="207" x2="152" y2="245"
          stroke="#5ba4e5" stroke-width="1.0" stroke-opacity="0.32"/>

    <!-- Rolled-Up End of the Yoga Pad (Left Side Cylinder) -->
    <path d="M 38 236 C 34 236 31 240 31 245 C 31 250 34 254 38 254 L 82 208 C 78 208 75 204 75 199 C 75 194 78 190 82 190 Z"
          fill="url(#yogaRoll)"
          stroke="#387eb8" stroke-width="1.3" stroke-opacity="0.64"/>

    <!-- Yoga Pad Roll Spiral End-Cap -->
    <ellipse cx="40" cy="245" rx="7.5" ry="9.5"
             fill="#152943" fill-opacity="0.76"
             stroke="#4b91d1" stroke-width="1.3" stroke-opacity="0.68"/>
    <path d="M 40 241 C 42 241 43 243 43 245 C 43 247 41 249 39 249 C 37 249 36 246 37 244"
          fill="none" stroke="#63b3ed" stroke-width="1.1" stroke-opacity="0.62" stroke-linecap="round"/>

    <!-- Soft Contact Shadow Where the GPU & Hologram Rest on the Pad -->
    <ellipse cx="184" cy="226" rx="74" ry="14"
             fill="#050d1a" fill-opacity="0.62"/>
  </g>

  <!-- ==================== 2. TRANSLUCENT DUAL-FAN GPU & LIVE TELEMETRY GRAPH ==================== -->
  <g transform="translate(96, 56)">
    <!-- Holographic Telemetry Graph Screen Rising Above the GPU -->
    <rect x="34" y="14" width="256" height="106" rx="10"
          fill="#0b1324" fill-opacity="0.72"
          stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.78"
          filter="url(#neonGlow)"/>

    <!-- Oscilloscope Grid Lines inside Hologram -->
    <line x1="46" y1="40" x2="278" y2="40" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4,4"/>
    <line x1="46" y1="67" x2="278" y2="67" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4,4"/>
    <line x1="46" y1="94" x2="278" y2="94" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4,4"/>
    <line x1="104" y1="22" x2="104" y2="112" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.22" stroke-dasharray="4,4"/>
    <line x1="162" y1="22" x2="162" y2="112" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.22" stroke-dasharray="4,4"/>
    <line x1="220" y1="22" x2="220" y2="112" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.22" stroke-dasharray="4,4"/>

    <!-- Secondary VRAM Emerald Area & Trace -->
    <path d="M 46 108 L 46 92 L 75 88 L 104 82 L 133 85 L 162 72 L 191 68 L 220 74 L 249 62 L 278 58 L 278 108 Z"
          fill="url(#graphEmeraldFill)"/>
    <path d="M 46 92 L 75 88 L 104 82 L 133 85 L 162 72 L 191 68 L 220 74 L 249 62 L 278 58"
          fill="none" stroke="#10b981" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Primary GPU Core Load Neon Cyan Area & Waveform Trace -->
    <path d="M 46 108 L 46 84 L 75 70 L 104 78 L 133 46 L 162 58 L 191 34 L 220 50 L 249 28 L 278 36 L 278 108 Z"
          fill="url(#graphCyanFill)"/>
    <path d="M 46 84 L 75 70 L 104 78 L 133 46 L 162 58 L 191 34 L 220 50 L 249 28 L 278 36"
          fill="none" stroke="#00f0ff" stroke-width="3.0" stroke-opacity="0.95"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

    <!-- Glowing Data Nodes on Waveform -->
    <circle cx="133" cy="46" r="3.4" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="191" cy="34" r="3.4" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="249" cy="28" r="3.8" fill="#ffffff" stroke="#00f0ff" stroke-width="1.6"/>
    <circle cx="278" cy="36" r="3.6" fill="#00f0ff"/>

    <!-- GPU I/O Bracket (Left) -->
    <path d="M 18 136 L 32 130 L 32 252 L 18 246 Z"
          fill="url(#gpuDeepBlue)" stroke="#5ba4e5" stroke-width="1.3" stroke-opacity="0.72"/>
    <rect x="21" y="150" width="7" height="16" rx="1.5" fill="#0a0e1a" fill-opacity="0.75" stroke="#7dd3fc" stroke-width="0.8" stroke-opacity="0.6"/>
    <rect x="21" y="176" width="7" height="16" rx="1.5" fill="#0a0e1a" fill-opacity="0.75" stroke="#7dd3fc" stroke-width="0.8" stroke-opacity="0.6"/>
    <rect x="21" y="202" width="7" height="16" rx="1.5" fill="#0a0e1a" fill-opacity="0.75" stroke="#7dd3fc" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- PCIe Connector Edge (Bottom) -->
    <rect x="74" y="250" width="172" height="9" rx="2"
          fill="#1e4263" fill-opacity="0.78" stroke="#00f0ff" stroke-width="1.1" stroke-opacity="0.65"/>
    <line x1="82" y1="254" x2="238" y2="254"
          stroke="#7dd3fc" stroke-width="3.2" stroke-opacity="0.75" stroke-dasharray="4,3"/>

    <!-- Main Translucent Darker-Blue GPU Card Shroud -->
    <path d="M 32 128 L 284 128 L 298 142 L 298 238 L 284 250 L 32 250 Z"
          fill="url(#gpuDarkBlue)"
          stroke="#63b3ed" stroke-width="1.8" stroke-opacity="0.78"/>

    <!-- Inner Geometric Frame & Neon Accent Strip -->
    <path d="M 40 135 L 278 135 L 289 146 L 289 233 L 278 243 L 40 243 Z"
          fill="url(#gpuDeepBlue)"
          stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.48"/>
    <rect x="46" y="139" width="232" height="5" rx="2.5"
          fill="url(#neonCyanEdge)" filter="url(#neonGlow)"/>

    <!-- Left Cooling Fan (Translucent Blue + Cyan Ring) -->
    <g transform="translate(100, 193)">
      <circle cx="0" cy="0" r="39" fill="#0a1222" fill-opacity="0.68" stroke="#5ba4e5" stroke-width="1.6" stroke-opacity="0.72"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00f0ff" stroke-width="0.9" stroke-opacity="0.65" stroke-dasharray="8,4"/>
      <path d="M 0 -11 C 9 -24 21 -31 30 -29 C 31 -23 25 -15 11 -8 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M 10 -5 C 24 -3 34 5 36 14 C 31 18 22 14 10 7 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M 8 8 C 19 19 22 31 17 38 C 12 36 7 27 3 12 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -3 11 C -10 24 -21 31 -30 29 C -31 23 -25 15 -11 8 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -10 5 C -24 3 -34 -5 -36 -14 C -31 -18 -22 -14 -10 -7 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -8 -8 C -19 -19 -22 -31 -17 -38 C -12 -36 -7 -27 -3 -12 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="12" fill="#152943" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="4.8" fill="#00f0ff" fill-opacity="0.9"/>
    </g>

    <!-- Right Cooling Fan (Translucent Blue + Cyan Ring) -->
    <g transform="translate(226, 193)">
      <circle cx="0" cy="0" r="39" fill="#0a1222" fill-opacity="0.68" stroke="#5ba4e5" stroke-width="1.6" stroke-opacity="0.72"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00f0ff" stroke-width="0.9" stroke-opacity="0.65" stroke-dasharray="8,4"/>
      <path d="M 0 -11 C 9 -24 21 -31 30 -29 C 31 -23 25 -15 11 -8 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M 10 -5 C 24 -3 34 5 36 14 C 31 18 22 14 10 7 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M 8 8 C 19 19 22 31 17 38 C 12 36 7 27 3 12 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -3 11 C -10 24 -21 31 -30 29 C -31 23 -25 15 -11 8 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -10 5 C -24 3 -34 -5 -36 -14 C -31 -18 -22 -14 -10 -7 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <path d="M -8 -8 C -19 -19 -22 -31 -17 -38 C -12 -36 -7 -27 -3 -12 Z" fill="#2b6496" fill-opacity="0.68" stroke="#7dd3fc" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="12" fill="#152943" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="4.8" fill="#00f0ff" fill-opacity="0.9"/>
    </g>

    <!-- Center Hexagonal GPU Core Badge -->
    <g transform="translate(163, 193)">
      <polygon points="0,-17 15,-8 15,8 0,17 -15,8 -15,-8"
               fill="#0d1b2e" fill-opacity="0.92" stroke="#00f0ff" stroke-width="1.6"/>
      <text x="0" y="3.5" font-family="monospace, sans-serif" font-weight="900" font-size="9.5" fill="#00f0ff" text-anchor="middle">GPU</text>
    </g>
  </g>
</svg>
